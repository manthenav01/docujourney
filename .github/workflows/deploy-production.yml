name: Deploy Production

# Deploys apps/public-app to Vercel production.
#
# Deploys are batched deliberately: every production deploy invalidates the
# whole ISR cache, so all ~30k entity pages become cold and the next crawl
# rewrites them — one billed Vercel ISR write each. A day of push-per-commit
# deploys therefore costs multiples of the free ISR write allowance on its own.
#
# NOTE: delete this workflow if the Vercel Git integration gets connected
# in the dashboard — otherwise every push would deploy twice.
on:
  push:
    branches: [main]
    # Only changes that can alter the built site trigger a deploy. Python ETL
    # under scripts/, docs, and CI config do not ship anything to Vercel.
    paths:
      - 'apps/public-app/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

# A burst of pushes should produce ONE deploy, not one per commit: supersede
# any run that has not started deploying yet and ship the newest main instead.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Vercel (production)
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
