name: CI

# Gates only the live product (apps/public-app + packages).
# The parked auth-app is intentionally excluded — it does not build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build public app (includes type-check)
        run: npm run build:public
        env:
          # Sitemap routes query BigQuery at build time; without credentials
          # they fail soft and prerender empty, which is fine for CI.
          NEXT_TELEMETRY_DISABLED: '1'
