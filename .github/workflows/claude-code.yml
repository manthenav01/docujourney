name: Claude Code Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write  # Required for OIDC authentication

jobs:
  claude-code:
    runs-on: ubuntu-latest
    # Only run if comment contains @claude or issue is assigned with @claude mention
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for better context
          fetch-depth: 0
      
      - name: Debug Event Information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "Issue #${{ github.event.issue.number }}"
            echo "Comment by: ${{ github.event.comment.user.login }}"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            echo "Issue #${{ github.event.issue.number }}"
            echo "Issue by: ${{ github.event.issue.user.login }}"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Check Claude Code Token
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "❌ CLAUDE_CODE_OAUTH_TOKEN secret not set"
            exit 1
          else
            echo "✅ CLAUDE_CODE_OAUTH_TOKEN is configured"
          fi

      # Configure Claude Code authentication
      - name: Configure Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Set up Claude Code authentication using OAuth token
          echo "Setting up Claude Code authentication..."
          # Note: This step configures the CLI to use OAuth token for GitHub integration

      - name: Process GitHub Event with Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Processing GitHub event with Claude Code..."
          
          # For now, just acknowledge the mention and log the event
          # The actual Claude Code GitHub integration may require a different setup
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "Received @claude mention in issue comment #${{ github.event.issue.number }}"
            echo "Comment: ${{ github.event.comment.body }}"
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            echo "Received @claude mention in new issue #${{ github.event.issue.number }}"
            echo "Issue body: ${{ github.event.issue.body }}"
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi
          
          # TODO: Integrate with Claude Code CLI once proper API is available
          echo "⚠️ Claude Code GitHub Action integration is still in development"
          echo "Using placeholder response for now"

      - name: Post Acknowledgment Comment
        if: github.event_name == 'issues' || github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          
          # Post a comment acknowledging the Claude mention
          gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments \
            --method POST \
            --field body="👋 Hello! I detected the @claude mention in this issue.

🚧 **Status**: Claude Code GitHub Actions integration is currently being set up.

**What's working:**
✅ Workflow triggers on @claude mentions
✅ Authentication is configured 
✅ Can post responses to issues

**Next steps:**
- Integrate with Claude Code CLI
- Enable actual AI-powered responses
- Test end-to-end functionality

The workflow is running successfully! This confirms that:
1. Your GitHub workflows are properly configured
2. Secrets are set up correctly  
3. The trigger conditions work as expected

Once the Claude Code action becomes available or we implement the CLI integration, you'll get full AI assistance directly in your issues and PRs.

_Workflow run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})_"

