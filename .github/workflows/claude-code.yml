name: Claude Code Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write  # Required for OIDC authentication

jobs:
  claude-code:
    runs-on: ubuntu-latest
    # Only run if comment contains @claude or issue is assigned with @claude mention
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for better context
          fetch-depth: 0
      
      - name: Debug Event Information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "Issue #${{ github.event.issue.number }}"
            echo "Comment by: ${{ github.event.comment.user.login }}"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            echo "Issue #${{ github.event.issue.number }}"
            echo "Issue by: ${{ github.event.issue.user.login }}"
          fi

      - name: Check Claude Code Token
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "❌ CLAUDE_CODE_OAUTH_TOKEN secret not set"
            exit 1
          else
            echo "✅ CLAUDE_CODE_OAUTH_TOKEN is configured"
          fi

      # Use Claude Code OAuth token instead of API key
      - name: Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          CLAUDE_PROJECT_NAME: "DocuJourney"
          CLAUDE_PROJECT_DESCRIPTION: "Immigration document management system with AI-powered analysis"

# Example usage:
# 1. In an issue comment: "@claude can you help fix the TypeScript error in src/components/ProfileForm.tsx?"
# 2. In a PR review: "@claude please update the tests for the new visa status analysis feature"
# 3. In an issue body: "@claude implement dark mode toggle for the dashboard"
#
