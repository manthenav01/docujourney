name: Claude Code Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude-code:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-3-5-sonnet-20241022
          max-tokens: 4096
          temperature: 0.7
          system-prompt: |
            You are an AI assistant helping with the DocuJourney project, an immigration document management system.
            Always follow the instructions in CLAUDE.md file.
            Focus on code quality, security, and following the established patterns in the codebase.
            When making changes, ensure they align with the existing architecture and coding standards.