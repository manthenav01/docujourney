name: Claude Code Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited, assigned]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug mode'
        required: false
        default: 'true'

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write  # Required for OIDC authentication

jobs:
  claude-code:
    runs-on: ubuntu-latest
    # Only run if @claude is mentioned or if manually triggered
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for better context
          fetch-depth: 0
      
      - name: Debug Event Information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "Issue #${{ github.event.issue.number }}"
            echo "Comment by: ${{ github.event.comment.user.login }}"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            echo "Issue #${{ github.event.issue.number }}"
            echo "Issue by: ${{ github.event.issue.user.login }}"
          fi

      # Node.js setup removed - not needed for GitHub Action

      - name: Check API Key
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "❌ ANTHROPIC_API_KEY secret not set"
            echo "Please add your Anthropic API key to repository secrets"
            exit 1
          else
            echo "✅ ANTHROPIC_API_KEY is configured"
          fi

      - name: Extract Request
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            REQUEST="${{ github.event.comment.body }}"
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            REQUEST="${{ github.event.issue.body }}"
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi
          
          # Remove @claude mention and clean up request
          REQUEST=$(echo "$REQUEST" | sed 's/@claude//g' | xargs)
          
          # Save for next step
          echo "request=$REQUEST" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

      - name: Run Claude Code
        uses: anthropics/claude-code-action@main  # Using main branch during beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-3-5-sonnet-20241022
          max_iterations: 3
          issue_number: ${{ steps.extract.outputs.issue_number }}
          request: ${{ steps.extract.outputs.request }}
          
      # Fallback if action fails
      - name: Post Error Comment
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ steps.extract.outputs.issue_number }}"
          
          gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments \
            --method POST \
            --field body="❌ Claude Code encountered an error. Please check the workflow logs or ensure ANTHROPIC_API_KEY is properly configured in repository secrets."

# Example usage:
# 1. In an issue comment: "@claude can you help fix the TypeScript error in src/components/ProfileForm.tsx?"
# 2. In a PR review: "@claude please update the tests for the new visa status analysis feature"
# 3. In an issue body: "@claude implement dark mode toggle for the dashboard"
#
