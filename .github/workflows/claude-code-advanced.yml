name: Claude Code Advanced Workflow

# This workflow demonstrates advanced Claude Code configurations
# for different automation scenarios in the DocuJourney project

on:
  # Trigger on PR comments for code review assistance
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  
  # Trigger on new PRs for automated analysis
  pull_request:
    types: [opened, synchronize]
    paths:
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "app/**/*.ts"
      - "app/**/*.tsx"
  
  # Trigger on issues for feature requests
  issues:
    types: [opened, assigned, labeled]
  
  # Manual trigger for on-demand assistance
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Direct prompt for Claude'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
  checks: write

jobs:
  # Job 1: Respond to @claude mentions
  claude-mentions:
    name: Handle Claude Mentions
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For PRs, checkout the PR branch
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Claude Code Response
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          timeout_minutes: "45"
          mode: "tag"
        env:
          CLAUDE_PROJECT_NAME: "DocuJourney"
          CLAUDE_PROJECT_DESCRIPTION: "Immigration document management system"
          # Pass additional context from CLAUDE.md
          CLAUDE_INSTRUCTIONS_FILE: "CLAUDE.md"

  # Job 2: Automated PR analysis
  pr-analysis:
    name: Automated PR Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            src/**/*.{ts,tsx}
            app/**/*.{ts,tsx}
            lib/**/*.{ts,tsx}
      
      - name: Claude PR Analysis
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: "agent"
          direct_prompt: |
            Analyze this pull request and provide feedback on:
            
            1. Code Quality:
               - TypeScript best practices
               - React/Next.js patterns
               - Performance considerations
            
            2. Security:
               - Check for exposed secrets or API keys
               - Validate Firebase security rules usage
               - Review authentication flows
            
            3. Architecture:
               - Alignment with existing patterns in CLAUDE.md
               - Component organization
               - State management approach
            
            4. Testing:
               - Suggest test cases for new functionality
               - Identify edge cases
            
            Changed files: ${{ steps.changed-files.outputs.all_changed_files }}
            
            Provide specific, actionable feedback with code examples where applicable.

  # Job 3: Documentation sync
  docs-sync:
    name: Documentation Sync
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && 
      (contains(github.event.pull_request.title, 'feat:') || 
       contains(github.event.pull_request.title, 'fix:'))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      
      - name: Update Documentation
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            Review the changes in this PR and update relevant documentation:
            
            1. If API endpoints changed, update API documentation
            2. If new components added, update component documentation
            3. If configuration changed, update setup instructions
            4. If new features added, update user guide
            
            Only make necessary documentation updates based on actual code changes.
            Do not create new documentation files unless absolutely necessary.

  # Job 4: Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && 
      (contains(github.event.pull_request.files, 'auth') ||
       contains(github.event.pull_request.files, 'api') ||
       contains(github.event.pull_request.files, 'firebase'))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      
      - name: Security Analysis
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            Perform a security audit of authentication and API changes:
            
            1. Check for proper authentication on all API routes
            2. Verify Firebase security rules are appropriate
            3. Ensure no sensitive data is exposed in responses
            4. Validate input sanitization
            5. Check for SQL injection or NoSQL injection risks
            6. Review CORS configuration
            
            Report any security concerns with severity levels (Critical/High/Medium/Low).

  # Job 5: Manual assistance
  manual-assist:
    name: Manual Claude Assistance
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Claude Manual Task
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: ${{ github.event.inputs.prompt }}
          timeout_minutes: "60"

# Workflow configuration notes:
# 
# 1. Set up required secrets in repository settings:
#    - ANTHROPIC_API_KEY: Your Anthropic API key
#    - GITHUB_TOKEN: Automatically provided by GitHub Actions
#
# 2. For cloud providers (AWS Bedrock, Google Vertex AI):
#    Replace anthropic_api_key with appropriate credentials
#
# 3. Timeout considerations:
#    - Default: 25 minutes
#    - Maximum: 60 minutes for complex tasks
#    - Adjust based on task complexity
#
# 4. Cost optimization:
#    - Use conditional jobs to avoid unnecessary runs
#    - Implement caching where possible
#    - Consider using depot-ubuntu-latest for faster runs
#
# 5. Security best practices:
#    - Never expose API keys in logs
#    - Use environment secrets for sensitive data
#    - Limit permissions to minimum required
#    - Review Claude's suggestions before auto-merging